name: Lint

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'
  # release.yml publishes on push to main, where maintainer changes land directly, so
  # kubeconform must see those pushes too. Only kubeconform-check runs (the other jobs
  # need a PR diff), as a full sweep: a push has no base ref for changed-chart detection.
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'
  # PRs re-validate only edited charts, but remote schemas can drift with zero repo
  # changes; the weekly run re-validates every chart so that surfaces on its own, and
  # dispatch does the same on demand. Only kubeconform-check runs on these events.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      charts:
        description: "Chart names to validate, space-separated (e.g. ghost mysql). Empty = every chart."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate charts
    # PR-only: ct's change detection needs a base ref to diff against, which the
    # schedule and workflow_dispatch events do not provide.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Helm Kustomize Lint (changed-charts)
        uses: somaz94/helm-kustomize-lint-action@v1
        with:
          mode: changed-charts
          charts_dir: charts
          base_ref: ${{ github.event.repository.default_branch }}
          helm_version: v3.16.4
          # Off: bumps are maintainer-driven (`make bump`), and ct would demand one for
          # tooling-only edits such as upgrade.sh. changelog-check below still guards
          # real Chart.yaml version changes.
          ct_check_version_increment: 'false'
          # Off: in changed-charts mode the action renders with empty values (ignores
          # ci/*.yaml), which fails charts with required input (ghost, unity-mcp-server).
          # ct lint in the "Helm lint" step renders each ci/*.yaml, and kubeconform-check
          # below runs `make validate`.
          run_template: 'false'
          run_kubeconform: 'false'

  changelog-check:
    name: CHANGELOG.md updated for version bumps
    # PR-only: there is no version bump to check outside a pull request diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md updates
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git fetch origin "${BASE_REF}" --depth=0 >/dev/null 2>&1 || git fetch origin "${BASE_REF}"
          # Detect charts whose Chart.yaml `version:` line changed in this PR.
          changed_charts=$(git diff "${base}...HEAD" -- 'charts/*/Chart.yaml' \
            | awk '/^\+\+\+ b\/charts\// { sub(/^\+\+\+ b\/charts\//, ""); split($0, a, "/"); chart=a[1] } \
                   /^[+-]version:/ && $0 !~ /^[+-]{3}/ { print chart }' \
            | sort -u)
          if [ -z "$changed_charts" ]; then
            echo "No chart version bumps detected — nothing to verify."
            exit 0
          fi
          echo "Charts with version bumps:"
          printf '  - %s\n' $changed_charts
          missing=()
          for c in $changed_charts; do
            if ! git diff --name-only "${base}...HEAD" | grep -qx "charts/${c}/CHANGELOG.md"; then
              missing+=("$c")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The following charts bumped Chart.yaml version but did not update CHANGELOG.md:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Run 'make changelog CHART=<name>' for each chart and commit the updated CHANGELOG.md."
            exit 1
          fi
          echo "All version-bumped charts have a corresponding CHANGELOG.md update."

  kubeconform-check:
    name: Schema validation (kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=v0.6.7
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Detect charts to validate
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.charts }}
        run: |
          set -euo pipefail
          # No diff on schedule/dispatch: an explicit list wins, else every chart. Emit real
          # names (no "all" sentinel) so there is one downstream path and the log shows the set.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            if [ -n "${REQUESTED:-}" ]; then
              for c in $REQUESTED; do
                if [ ! -d "charts/$c" ]; then
                  echo "::error::requested chart does not exist: charts/$c"
                  exit 1
                fi
              done
              echo "Validating requested charts:"
              printf '  - %s\n' $REQUESTED
              echo "list=${REQUESTED}" >> "$GITHUB_OUTPUT"
            else
              all=$(find charts -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' ')
              echo "Full sweep — validating every chart:"
              printf '  - %s\n' $all
              echo "list=${all% }" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          base="origin/${BASE_REF}"
          git fetch origin "${BASE_REF}" --depth=0 >/dev/null 2>&1 || git fetch origin "${BASE_REF}"
          # Charts whose tracked files (anything under charts/<name>/) changed
          # in this PR. Deleted charts are filtered out so we never try to
          # render a directory that no longer exists.
          changed=$(git diff --name-only "${base}...HEAD" -- 'charts/*' \
            | awk -F/ '$1 == "charts" && NF >= 2 { print $2 }' \
            | sort -u)
          existing=()
          for c in $changed; do
            [ -d "charts/$c" ] && existing+=("$c")
          done
          if [ ${#existing[@]} -eq 0 ]; then
            echo "No chart changes detected — skipping schema validation."
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "Charts to validate:"
            printf '  - %s\n' "${existing[@]}"
            echo "list=${existing[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run kubeconform
        if: steps.changed.outputs.list != ''
        env:
          CHANGED: ${{ steps.changed.outputs.list }}
        run: |
          set -euo pipefail
          # Same code path as local `make validate` (one render per ci/*.yaml → kubeconform).
          for c in $CHANGED; do
            echo "==> validating $c"
            make validate CHART="$c"
          done
