name: Shell Lint

# push matters as much as pull_request here: this repo lands maintainer changes
# by pushing straight to main, and the auto-bump PRs that check-versions.yml
# opens are created with GITHUB_TOKEN, so they sit in `action_required` without
# running checks. With pull_request alone, shell-lint covered neither path.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'charts/*/upgrade.sh'
      - 'Makefile'
      - '.github/workflows/shell-lint.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'charts/*/upgrade.sh'
      - 'Makefile'
      - '.github/workflows/shell-lint.yml'

permissions:
  contents: read

concurrency:
  group: shell-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-lint:
    name: bash + zsh syntax + shellcheck + zsh-portability guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install zsh and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck

      - name: Run shell-lint (STRICT=1 fails if shellcheck is missing)
        run: STRICT=1 make shell-lint
