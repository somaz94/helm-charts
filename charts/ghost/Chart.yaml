apiVersion: v2
name: ghost
description: Ghost CMS (Node.js blogging platform) with optional bundled MySQL, backup CronJob, HTTPRoute (Gateway API) and Ingress. Geared for self-hosted blogs on Kubernetes with a single-release install.
type: application
version: 0.1.9
appVersion: "5.130.6"
kubeVersion: ">=1.25.0-0"
keywords:
  - ghost
  - blog
  - cms
  - publishing
  - mysql
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://github.com/TryGhost/Ghost
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: Ghost
      url: https://ghost.org/
    - name: Ghost Docker image
      url: https://hub.docker.com/_/ghost
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Backup CronJob no longer leaves an empty .sql or .tar.gz behind when mysqldump or tar fails outright. Both the output redirect and tar czf create their file before writing content, and set -e then exited past the cleanup, so a failed run left a 0-byte artifact that reads as real when listing the backup directory. Cleanup now runs from per-artifact traps, each disarmed only after that artifact passes verification; a verified DB dump is still kept when the content archive is what fails."
