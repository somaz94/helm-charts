# Values used by CI to exercise `helm lint`, `helm template`, chart-testing
# and kubeconform. Not a deployment recipe — credentials below are dummy and
# must not be reused.
url: https://blog.example.com
mysql:
  auth:
    user: ghost
    password: example-password
    database: ghost
    rootPassword: ci-test-root-password
backup:
  enabled: true
httproute:
  enabled: true
  parentRefs:
    - name: ngf
      namespace: nginx-gateway
  hostnames:
    - blog.example.com
ingress:
  enabled: true
  className: nginx
  host: blog.example.com
nginxGatewayFabric:
  clientSettings:
    enabled: true
    bodyMaxSize: "500m"
serviceMonitor:
  enabled: true
serviceAccount:
  create: true
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - protocol: TCP
          port: 2368

# Escape hatch — each key renders as its own manifest document
# (templates/extra.yaml). Kept trivial: the point is to exercise the code path,
# not to model a real add-on.
kubernetesExtra:
  ci-extra-configmap:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ci-extra
    data:
      rendered-by: kubernetesExtra

# Chart-managed image pull Secret (templates/imagepullsecret.yaml).
# dockerconfigjson is base64 of `{"auths":{}}` — a valid but empty credential.
imagePullSecret:
  create: true
  dockerconfigjson: eyJhdXRocyI6e319
