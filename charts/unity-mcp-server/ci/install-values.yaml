# Values used by CI to exercise helm lint/template/validate + chart-testing.
# Not a deployment recipe — the image/key below are placeholders.
image:
  repository: ghcr.io/example/unity-mcp-server
  tag: ci-dummy
apiKey:
  value: ci-dummy-key
httproute:
  enabled: true
  parentRefs:
    - name: ngf
      namespace: nginx-gateway
  hostnames:
    - unity-mcp.example.com
ingress:
  enabled: true
  className: nginx
  host: unity-mcp.example.com
nginxGatewayFabric:
  proxySettings:
    enabled: true
serviceAccount:
  create: true
networkPolicy:
  enabled: true

# Escape hatch — each key renders as its own manifest document
# (templates/extra.yaml). Kept trivial: the point is to exercise the code path,
# not to model a real add-on.
kubernetesExtra:
  ci-extra-configmap:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ci-extra
    data:
      rendered-by: kubernetesExtra

# Chart-managed image pull Secret (templates/imagepullsecret.yaml).
# dockerconfigjson is base64 of `{"auths":{}}` — a valid but empty credential.
imagePullSecret:
  create: true
  dockerconfigjson: eyJhdXRocyI6e319
