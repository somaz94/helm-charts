{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sqs-consumer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqs-consumer.labels" . | nindent 4 }}
    {{- with .Values.resourceMetadata.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := include "sqs-consumer.annotations" (dict "top" . "extra" (merge (deepCopy (default (dict) .Values.resourceMetadata.serviceAccount.annotations)) (deepCopy (default (dict) .Values.serviceAccount.annotations)))) }}
  {{- if $ann }}
  annotations:
    {{- $ann | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
