apiVersion: v2
name: sqs-consumer
description: KEDA-scaled AWS SQS consumer that scales to zero — Deployment + ServiceAccount (IRSA / EKS Pod Identity) + KEDA ScaledObject (aws-sqs-queue trigger) + TriggerAuthentication (podIdentity provider aws). Renders a plain Deployment when KEDA is disabled.
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - sqs
  - aws
  - keda
  - autoscaling
  - scale-to-zero
  - event-driven
  - queue
  - consumer
  - irsa
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://github.com/somaz94/sqs-consumer
maintainers:
