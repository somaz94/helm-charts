      description: "Initial release: KEDA-scaled SQS consumer Deployment with scale to zero, an aws-sqs-queue ScaledObject, a podIdentity TriggerAuthentication (identityOwner workload / keda, or an explicit roleArn), an IRSA-ready ServiceAccount, and a plain-Deployment mode when keda.enabled is false."
