      url: https://github.com/somaz94/sqs-consumer
    - name: KEDA AWS SQS Queue scaler
      url: https://keda.sh/docs/latest/scalers/aws-sqs/
    - name: KEDA AWS (IRSA) authentication
      url: https://keda.sh/docs/latest/authentication-providers/aws/
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
