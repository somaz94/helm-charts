apiVersion: v2
name: karpenter-cr
description: Custom resources (EC2NodeClass, NodePool) for AWS Karpenter, deployed alongside the upstream Karpenter controller chart. Data-driven — render any number of node classes / pools from values.
type: application
version: 0.2.0
appVersion: "1.13.0"
kubeVersion: ">=1.31.0-0"
keywords:
  - karpenter
  - nodepool
  - ec2nodeclass
  - autoscaling
  - kubernetes
  - aws
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://github.com/aws/karpenter-provider-aws
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: Karpenter
      url: https://karpenter.sh/
  artifacthub.io/changes: |
    - kind: added
      description: "Support EKS Auto Mode: nodeClassGroup / nodeClassKind select the node class API a NodePool binds to (eks.amazonaws.com/NodeClass), settable per pool or in nodePoolDefaults. Defaults are unchanged, so self-managed Karpenter values render byte-identically."
    - kind: added
      description: "Add terminationGracePeriod to NodePool entries and nodePoolDefaults, so a pool can cap how long a node may take to drain."
  artifacthub.io/prerelease: "false"
