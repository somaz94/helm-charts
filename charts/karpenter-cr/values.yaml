# karpenter-cr — data-driven EC2NodeClass + NodePool custom resources for AWS Karpenter.
#
# The chart ships NO opinionated pools: supply `nodeClasses` and `nodePools` from your
# environment values. Each entry inherits the shared `*Defaults` block and overrides
# only what it needs — add a pool by appending one entry, no template edits.

# Extra labels / annotations added to every rendered resource.
commonLabels: {}
commonAnnotations: {}

# Cluster name + discovery tag KEY used to resolve subnets / security groups for every
# EC2NodeClass (unless an entry supplies explicit selector terms). Karpenter's terraform
# submodule stamps { <discoveryKey> = <clusterName> } onto the subnets and node SG.
clusterName: ""
discoveryKey: karpenter.sh/discovery

# ---------------------------------------------------------------------------
# Shared defaults — applied to every entry unless the entry overrides the field.
# ---------------------------------------------------------------------------
nodeClassDefaults:
  amiFamily: AL2023
  # SSM AMI alias (e.g. al2023@latest, al2023@v20240625). EMPTY by default on purpose:
  # `@latest` would silently drift node AMIs, so each consumer must choose explicitly —
  # set amiAlias (here or per entry) OR provide amiSelectorTerms. One of the two is required.
  amiAlias: ""
  # Per-entry amiSelectorTerms (raw list) take full control of AMI selection when set.
  amiSelectorTerms: []
  # IAM role NAME (not ARN) for Karpenter-launched nodes. Required (here or per entry).
  role: ""
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 2
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # Extra tags merged onto every node (the discovery tag is always added).
  tags: {}

nodePoolDefaults:
  # Which NodeClass API the NodePool binds to. The defaults target the upstream Karpenter
  # AWS provider, which serves EC2NodeClass and is what `nodeClasses` below renders.
  #
  # EKS Auto Mode is the other case: AWS runs Karpenter for you and serves its own
  # NodeClass API, so a pool there must point at `eks.amazonaws.com` / `NodeClass` and
  # reference the built-in class (`nodeClassRef: default`). Leave `nodeClasses` empty in
  # that mode — Auto Mode owns the class, and rendering an EC2NodeClass would apply a CRD
  # that cluster does not serve.
  #
  #   nodePoolDefaults:
  #     nodeClassGroup: eks.amazonaws.com
  #     nodeClassKind: NodeClass
  #
  # The NodePool kind itself is `karpenter.sh/v1` in BOTH modes; only the class differs.
  nodeClassGroup: karpenter.k8s.aws
  nodeClassKind: EC2NodeClass
  # Upper bound on how long a node may take to drain before it is removed anyway (e.g.
  # 24h). Empty leaves the field off so Karpenter's own default applies.
  terminationGracePeriod: ""
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h
  # Default capacity cap per pool. Override per entry.
  limits:
    cpu: "100"

# ---------------------------------------------------------------------------
# EC2NodeClasses — one per distinct launch profile (AMI / role / disk / IMDS).
# Leave empty under EKS Auto Mode; see nodePoolDefaults.nodeClassGroup above.
# Schema per entry:
#   name (required), role, amiFamily, amiAlias, amiSelectorTerms,
#   subnetSelectorTerms, securityGroupSelectorTerms (default: discovery tag),
#   metadataOptions, blockDeviceMappings, tags, userData, detailedMonitoring, kubelet
# ---------------------------------------------------------------------------
nodeClasses: []

# ---------------------------------------------------------------------------
# NodePools — what Karpenter may provision. Schema per entry:
#   name (required), nodeClassRef (default: name), nodeClassGroup, nodeClassKind,
#   labels, annotations, taints, startupTaints, requirements (raw list, required),
#   limits, disruption, terminationGracePeriod, weight
# ---------------------------------------------------------------------------
nodePools: []
