{{- if .Values.backup.enabled -}}
{{- if and .Values.backup.persistence.enabled (not .Values.backup.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "postgresql.backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
    {{- with .Values.resourceMetadata.backupPvc.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $pvcAnn := include "postgresql.annotations" (dict "top" . "extra" (merge (deepCopy (default (dict) .Values.backup.persistence.annotations)) (deepCopy (default (dict) .Values.resourceMetadata.backupPvc.annotations)))) }}
  {{- if $pvcAnn }}
  annotations:
    {{- $pvcAnn | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgresql.backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
    {{- with .Values.resourceMetadata.backupCronJob.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $cjAnn := include "postgresql.annotations" (dict "top" . "extra" .Values.resourceMetadata.backupCronJob.annotations) }}
  {{- if $cjAnn }}
  annotations:
    {{- $cjAnn | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          {{- include "postgresql.imagePullSecretsBlock" . | nindent 10 }}
          containers:
            - name: backup
              image: {{ include "postgresql.backup.image" . | quote }}
              imagePullPolicy: {{ include "postgresql.backup.imagePullPolicy" . }}
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  DATE=$(date +%Y%m%d)
                  BACKUP_DIR="/backup-data"
                  RETENTION_DAYS={{ .Values.backup.retentionDays }}
                  DB_HOST={{ include "postgresql.fullname" . | quote }}
                  DB_PORT={{ .Values.service.port }}
                  TARGET_DB="${POSTGRES_DB:-}"
                  export PGPASSWORD="$POSTGRES_PASSWORD"

                  echo "[$(date)] Starting PostgreSQL backup..."

                  if [ -n "$TARGET_DB" ]; then
                    OUT="$BACKUP_DIR/postgres-${TARGET_DB}-${DATE}.sql"
                  else
                    OUT="$BACKUP_DIR/postgres-all-${DATE}.sql"
                  fi

                  # Nothing below may leave a file behind unless it is verified complete.
                  # The redirects create $OUT before pg_dump has written a byte, so a dump
                  # that fails outright — version mismatch, refused connection, bad
                  # credentials — leaves an empty file while `set -e` exits straight past
                  # the verification block that would have removed it. An empty .sql sitting
                  # in the backup directory reads as a real dump to anyone listing it.
                  # The trap owns cleanup for every failure path and is disarmed only once
                  # the dump has passed verification.
                  trap 'rm -f "$OUT"' EXIT

                  if [ -n "$TARGET_DB" ]; then
                    pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" \
                      --clean --if-exists --no-owner --no-acl \
                      "$TARGET_DB" > "$OUT"
                  else
                    pg_dumpall -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" \
                      --clean --if-exists --no-owner --no-role-passwords \
                      > "$OUT"
                  fi

                  # Verify at write time. `set -e` aborts on a pg_dump that exits non-zero,
                  # but a dump cut short — a full disk, a killed connection or a container
                  # OOM — exits zero and leaves a plausible-looking .sql file behind.
                  # pg_dump writes a terminating comment as its very last line, so its
                  # absence means the file is truncated no matter how large it looks.
                  # Without this the truncation is discovered at restore time, which is the
                  # one moment it cannot be fixed.
                  if ! tail -n 5 "$OUT" | grep -q 'PostgreSQL database dump complete'; then
                    echo "[$(date)] ERROR: $(basename "$OUT") is truncated — the dump-complete marker is missing"
                    exit 1
                  fi

                  # Verified complete, so it must survive every later exit path. Disarming
                  # here rather than at the end of the script is deliberate: retention and
                  # the listing below must never be able to delete the dump just taken.
                  trap - EXIT
                  echo "[$(date)] DB backup: $(basename "$OUT") ($(du -h "$OUT" | cut -f1)) — verified"

                  DEL=$(find "$BACKUP_DIR" -name "postgres-*.sql" -mtime +${RETENTION_DAYS} -delete -print | wc -l)
                  echo "[$(date)] Retention: deleted $DEL backups older than ${RETENTION_DAYS} days"

                  echo ""
                  echo "Available backups:"
                  ls -lh "$BACKUP_DIR"/postgres-*.sql 2>/dev/null || echo "  (none)"
                  echo ""
                  echo "[$(date)] PostgreSQL backup complete."
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "postgresql.secretName" . }}
                      key: {{ .Values.auth.secretKeys.user | quote }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "postgresql.secretName" . }}
                      key: {{ .Values.auth.secretKeys.password | quote }}
                {{- if .Values.auth.database }}
                - name: POSTGRES_DB
                  value: {{ .Values.auth.database | quote }}
                {{- end }}
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: backup
                  mountPath: /backup-data
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.existingClaim | default (include "postgresql.backup.fullname" .) }}
          {{- with .Values.backup.jobTemplateExtra }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
  {{- with .Values.backup.specExtra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
