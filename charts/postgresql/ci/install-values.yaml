# Values used by CI to exercise `helm lint`, `helm template`, chart-testing
# and kubeconform. Not a deployment recipe — credentials below are dummy and
# must not be reused.
auth:
  user: ci
  password: example-password
  database: ci
backup:
  enabled: true
serviceAccount:
  create: true
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ci-app
      ports:
        - protocol: TCP
          port: 5432
imagePullSecret:
  create: true
  dockerconfigjson: eyJhdXRocyI6IHt9fQ==
logCollector:
  enabled: true

# Escape hatch — each key renders as its own manifest document
# (templates/extra.yaml). Kept trivial: the point is to exercise the code path,
# not to model a real add-on.
kubernetesExtra:
  ci-extra-configmap:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ci-extra
    data:
      rendered-by: kubernetesExtra
