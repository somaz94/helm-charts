apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "buildkit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildkit
    {{- with .Values.resourceMetadata.statefulSet.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := include "buildkit.annotations" (dict "top" . "extra" .Values.resourceMetadata.statefulSet.annotations) }}
  {{- if $ann }}
  annotations:
    {{- $ann | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "buildkit.serviceName" . }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "buildkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildkit.selectorLabels" . | nindent 8 }}
      {{- if eq (include "buildkit.useConfigFile" .) "true" }}
      annotations:
        checksum/config: {{ include "buildkit.effectiveConfig" . | sha256sum }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "buildkit.fullname" .) }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- include "buildkit.imagePullSecretsBlock" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq (include "buildkit.useTrustStore" .) "true" }}
      initContainers:
        - name: install-ca
          image: {{ include "buildkit.initContainerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              cat /etc/ssl/certs/ca-certificates.crt /input/{{ .Values.registry.caBundle.key }} \
                > /shared/{{ base .Values.registry.caBundle.trustBundlePath }}
          volumeMounts:
            - name: registry-ca
              mountPath: /input
              readOnly: true
            - name: trust-bundle
              mountPath: /shared
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: buildkitd
          image: "{{ .Values.image.repository }}:{{ include "buildkit.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --addr
            - unix://{{ .Values.listener.unixSocket }}
            {{- if .Values.listener.tcp.enabled }}
            - --addr
            - tcp://0.0.0.0:{{ .Values.listener.tcp.port }}
            {{- end }}
            {{- if eq (include "buildkit.useConfigFile" .) "true" }}
            - --config
            - /etc/buildkit/buildkitd.toml
            {{- end }}
          {{- if .Values.listener.tcp.enabled }}
          ports:
            - name: buildkitd
              containerPort: {{ .Values.listener.tcp.port }}
              protocol: TCP
          {{- end }}
          {{- if eq (include "buildkit.useTrustStore" .) "true" }}
          env:
            - name: SSL_CERT_FILE
              value: {{ .Values.registry.caBundle.trustBundlePath | quote }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- if eq (include "buildkit.useConfigFile" .) "true" }}
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
            {{- end }}
            {{- if eq (include "buildkit.useCaBundle" .) "true" }}
            - name: registry-ca
              mountPath: {{ dir .Values.registry.caBundle.caPath | quote }}
              readOnly: true
            {{- end }}
            {{- if eq (include "buildkit.useTrustStore" .) "true" }}
            - name: trust-bundle
              mountPath: {{ dir .Values.registry.caBundle.trustBundlePath | quote }}
              readOnly: true
            {{- if .Values.registry.caBundle.systemTrustStorePath }}
            - name: trust-bundle
              mountPath: {{ .Values.registry.caBundle.systemTrustStorePath | quote }}
              subPath: {{ base .Values.registry.caBundle.trustBundlePath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: cache
          emptyDir: {}
        {{- end }}
        {{- if eq (include "buildkit.useConfigFile" .) "true" }}
        - name: config
          configMap:
            name: {{ include "buildkit.configMapName" . }}
        {{- end }}
        {{- if eq (include "buildkit.useCaBundle" .) "true" }}
        - name: registry-ca
          secret:
            secretName: {{ include "buildkit.caSecretName" . }}
            items:
              - key: {{ .Values.registry.caBundle.key | quote }}
                path: {{ base .Values.registry.caBundle.caPath | quote }}
        {{- end }}
        {{- if eq (include "buildkit.useTrustStore" .) "true" }}
        - name: trust-bundle
          emptyDir: {}
        {{- end }}
      {{- with .Values.podTemplateExtra }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        labels:
          {{- include "buildkit.labels" . | nindent 10 }}
          app.kubernetes.io/component: buildkit
          {{- with .Values.resourceMetadata.pvc.labels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- $pvcAnn := include "buildkit.annotations" (dict "top" . "extra" (merge (deepCopy (default (dict) .Values.persistence.annotations)) (deepCopy (default (dict) .Values.resourceMetadata.pvc.annotations)))) }}
        {{- if $pvcAnn }}
        annotations:
          {{- $pvcAnn | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
  {{- with .Values.specExtra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
