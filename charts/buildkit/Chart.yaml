apiVersion: v2
name: buildkit
description: Standalone BuildKit StatefulSet — moby/buildkit pod (rootful, privileged) with optional CA-bundle Secret + optional buildkitd.toml ConfigMap, cache PVC via volumeClaimTemplates, ClusterIP Service on TCP 1234. Suits dev/staging container builds where ephemeral buildx builders fail to verify a self-signed registry's OAuth token endpoint — bake the registry CA into the BuildKit pod's trust store so multi-arch buildx (kubernetes/remote driver) succeeds. NetworkPolicy, ServiceAccount, kubernetesExtra escape hatch.
type: application
version: 0.1.4
appVersion: "v0.33.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - buildkit
  - buildx
  - oci-build
  - cicd
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
