apiVersion: v2
name: buildkit
description: Standalone BuildKit StatefulSet — moby/buildkit pod (rootful, privileged) with optional CA-bundle Secret + optional buildkitd.toml ConfigMap, cache PVC via volumeClaimTemplates, ClusterIP Service on TCP 1234. Suits dev/staging container builds where ephemeral buildx builders fail to verify a self-signed registry's OAuth token endpoint — bake the registry CA into the BuildKit pod's trust store so multi-arch buildx (kubernetes/remote driver) succeeds. NetworkPolicy, ServiceAccount, kubernetesExtra escape hatch.
type: application
version: 0.1.2
appVersion: "v0.29.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - buildkit
  - buildx
  - oci-build
  - cicd
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://github.com/moby/buildkit
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: BuildKit upstream
      url: https://github.com/moby/buildkit
    - name: Buildx kubernetes driver
      url: https://docs.docker.com/build/builders/drivers/kubernetes/
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "`registry.caBundle.systemTrustStorePath` (default `/etc/ssl/certs/ca-certificates.crt`) — when `installToTrustStore` is true, the merged bundle is also subPath-mounted at this absolute path inside the main container, overlaying the OS's default trust store file. Required for BuildKit's OAuth token call against self-signed Harbor: containerd's docker resolver only reads the system trust store and ignores `SSL_CERT_FILE`, so the previous 0.1.1 setup (env var + sibling directory mount) was insufficient. Set to empty string to disable the overlay."
    - kind: fixed
      description: "0.1.1 set `installToTrustStore: true` but BuildKit OAuth still failed with `x509: certificate signed by unknown authority` because the env-var-only setup did not reach containerd. 0.1.2 ships the system path overlay by default (alpine-style `ca-certificates.crt`), so the OAuth client picks the merged bundle up automatically."
