apiVersion: v2
name: buildkit
description: Standalone BuildKit StatefulSet — moby/buildkit pod (rootful, privileged) with optional CA-bundle Secret + optional buildkitd.toml ConfigMap, cache PVC via volumeClaimTemplates, ClusterIP Service on TCP 1234. Suits dev/staging container builds where ephemeral buildx builders fail to verify a self-signed registry's OAuth token endpoint — bake the registry CA into the BuildKit pod's trust store so multi-arch buildx (kubernetes/remote driver) succeeds. NetworkPolicy, ServiceAccount, kubernetesExtra escape hatch.
type: application
version: 0.1.1
appVersion: "v0.29.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - buildkit
  - buildx
  - oci-build
  - cicd
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://github.com/moby/buildkit
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: BuildKit upstream
      url: https://github.com/moby/buildkit
    - name: Buildx kubernetes driver
      url: https://docs.docker.com/build/builders/drivers/kubernetes/
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "`registry.caBundle.installToTrustStore` (default false) — when true, an init container `install-ca` concatenates the base image's `/etc/ssl/certs/ca-certificates.crt` with the supplied registry CA into an emptyDir volume, and the main container's `SSL_CERT_FILE` env points at it. This makes BuildKit trust the registry CA at the OAuth token endpoint (`/service/token`), which buildkitd.toml's `[registry.<host>].ca` does NOT cover. Required for self-signed Harbor and similar registries with token-based auth."
    - kind: added
      description: "`registry.caBundle.initContainerImage` / `initContainerImageTag` / `trustBundlePath` knobs to override the trust-store init container's image and the merged bundle's mount path."
    - kind: added
      description: "NOTES.txt now flags whether the trust store has been installed and warns on the OAuth verification failure mode if it has not."
