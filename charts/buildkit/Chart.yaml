apiVersion: v2
name: buildkit
description: Standalone BuildKit StatefulSet — moby/buildkit pod (rootful, privileged) with optional CA-bundle Secret + optional buildkitd.toml ConfigMap, cache PVC via volumeClaimTemplates, ClusterIP Service on TCP 1234. Suits dev/staging container builds where ephemeral buildx builders fail to verify a self-signed registry's OAuth token endpoint — bake the registry CA into the BuildKit pod's trust store so multi-arch buildx (kubernetes/remote driver) succeeds. NetworkPolicy, ServiceAccount, kubernetesExtra escape hatch.
type: application
version: 0.1.0
appVersion: "v0.29.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - buildkit
  - buildx
  - oci-build
  - cicd
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://github.com/moby/buildkit
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: BuildKit upstream
      url: https://github.com/moby/buildkit
    - name: Buildx kubernetes driver
      url: https://docs.docker.com/build/builders/drivers/kubernetes/
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release. Standalone BuildKit StatefulSet with optional buildkitd.toml ConfigMap (registry trust + cache config), optional Secret (CA bundle for self-signed registries), volumeClaimTemplates cache PVC, ClusterIP Service (port 1234), NetworkPolicy, ServiceAccount, image pull Secret (chart-managed dockerconfigjson + BYOIPS), kubernetesExtra escape hatch. Default appVersion v0.29.0; container runs rootful with privileged securityContext for cgroup mount (rootless mode left to a future toggle)."
    - kind: added
      description: "`registry.caBundle.{enabled,existingSecret,key,host,ca}` for mounting a self-signed registry CA into BuildKit's trust store. When `existingSecret` is empty and `ca` is non-empty, the chart renders a Secret containing the CA file."
    - kind: added
      description: "`buildkitdConfig` opaque string mapped to `buildkitd.toml`. When empty the chart auto-renders a minimal config that wires `registry.caBundle.host` to the mounted CA path."
