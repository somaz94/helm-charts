apiVersion: v2
name: mysql
description: Standalone single-node MySQL 8 — Deployment + ConfigMap + Secret + PVC + Service, optional backup CronJob (mysqldump), NetworkPolicy, ServiceAccount. Recreate strategy. Suits dev/staging single-replica installs and legacy raw-YAML migrations (existingClaim / existingSecret / fullnameOverride for in-place adoption).
type: application
version: 0.1.4
appVersion: "8.0.43"
kubeVersion: ">=1.25.0-0"
keywords:
  - mysql
  - database
  - rdbms
  - kubernetes
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
  - https://hub.docker.com/_/mysql
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: MySQL Docker image
      url: https://hub.docker.com/_/mysql
    - name: MySQL 8.0 Reference Manual
      url: https://dev.mysql.com/doc/refman/8.0/en/
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "A chart version bump no longer restarts the database. The checksum/config and checksum/secret pod annotations hashed the whole rendered ConfigMap and Secret, which carry a helm.sh/chart label containing the chart version, so every release changed them and rolled the pod — and with strategy Recreate that is downtime, not a rolling swap. They now hash only the data / stringData payload, so they move when the config or the credentials move and stay put otherwise."
