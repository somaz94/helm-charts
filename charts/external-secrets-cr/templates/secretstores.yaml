{{- $top := . -}}
{{- range $store := .Values.secretStores }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ required "secretStores[].name is required" $store.name }}
  namespace: {{ $store.namespace | default $top.Release.Namespace }}
  labels:
    {{- include "external-secrets-cr.labels" $top | nindent 4 }}
    {{- with $store.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annot := include "external-secrets-cr.annotations" (dict "top" $top "extra" $store.annotations) }}
  {{- if $annot }}
  annotations:
    {{- $annot | nindent 4 }}
  {{- end }}
spec:
  provider:
    {{- toYaml (required "secretStores[].provider is required" $store.provider) | nindent 4 }}
  {{- with $store.refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  {{- with $store.retrySettings }}
  retrySettings:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $store.conditions }}
  conditions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $store.controller }}
  controller: {{ . }}
  {{- end }}
  {{- with $store.specExtra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- end }}
