# Default values for external-secrets-cr.
# This chart templates External Secrets Operator (ESO) *configuration* custom
# resources. The upstream external-secrets/external-secrets chart installs the
# controller, webhook and CRDs but does NOT template config CRs (SecretStore,
# ExternalSecret, PushSecret, ...) — those are left to the user to apply
# out-of-band. This chart fills that gap so the ESO configuration is managed
# declaratively as a Helm release alongside the operator.
#
# The chart ships with safe empty defaults: an unconfigured `helm install` is a
# no-op (creates no resources). Define the lists below to create CRs.
#
# Prerequisite: the External Secrets CRDs (external-secrets.io/v1 and, for
# PushSecret, external-secrets.io/v1alpha1) must already be installed in the
# cluster (the upstream chart's `installCRDs: true`).

# ---------------------------------------------------------------------------
# Resource metadata
# ---------------------------------------------------------------------------
# Labels and annotations applied to EVERY resource created by this chart.
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------
# SecretStores (external-secrets.io/v1, namespaced)
# ---------------------------------------------------------------------------
# A namespaced backend definition (AWS Secrets Manager, Vault, GCP, ...). The
# `provider` block is backend-specific and passed through verbatim.
#
# Per-entry fields:
#   name            (required) SecretStore name.
#   namespace       (optional) Target namespace (default: release namespace).
#   provider        (required) Provider block, verbatim (aws / vault / gcpsm / ...).
#   refreshInterval (optional) Store refresh interval in SECONDS (integer; 0 or
#                              empty = controller default). NOTE: (Cluster)SecretStore
#                              takes an integer here, unlike ExternalSecret/PushSecret
#                              which take a duration string ("1h").
#   retrySettings   (optional) { maxRetries, retryInterval }.
#   conditions      (optional) Namespace/label conditions restricting use.
#   controller      (optional) Controller class that should process this store.
#   labels/annotations (optional) Extra metadata on this resource.
#   specExtra       (optional) Arbitrary YAML merged into spec for unsurfaced fields.
secretStores: []
# Example:
#   secretStores:
#     - name: vault-backend
#       provider:
#         vault:
#           server: https://vault.example.com:8200
#           path: secret
#           version: v2
#           auth:
#             kubernetes:
#               mountPath: kubernetes
#               role: eso

# ---------------------------------------------------------------------------
# ClusterSecretStores (external-secrets.io/v1, cluster-scoped)
# ---------------------------------------------------------------------------
# A cluster-wide backend definition usable from any namespace. Same shape as
# SecretStore but without a namespace, plus `conditions` to scope which
# namespaces may reference it.
#
# Per-entry fields:
#   name            (required) ClusterSecretStore name.
#   provider        (required) Provider block, verbatim.
#   refreshInterval (optional) Store refresh interval in SECONDS (integer; 0 or
#                              empty = controller default).
#   retrySettings   (optional) { maxRetries, retryInterval }.
#   conditions      (optional) namespaceSelector / namespaces / namespaceRegexes.
#   controller      (optional) Controller class.
#   labels/annotations/specExtra (optional)
clusterSecretStores: []
# Example:
#   clusterSecretStores:
#     - name: aws-secretsmanager
#       provider:
#         aws:
#           service: SecretsManager
#           region: eu-central-1
#       # Auth omitted → ESO uses the pod's default AWS credential chain
#       # (e.g. EKS Pod Identity / IRSA).

# ---------------------------------------------------------------------------
# ExternalSecrets (external-secrets.io/v1, namespaced)
# ---------------------------------------------------------------------------
# Pulls values from a (Cluster)SecretStore into a native Kubernetes Secret.
#
# Per-entry fields:
#   name            (required) ExternalSecret name (default target Secret name too).
#   namespace       (optional) Target namespace (default: release namespace).
#   refreshInterval (optional) Sync interval (e.g. "1h", "0" to disable).
#   secretStoreRef  (optional) { name, kind: SecretStore|ClusterSecretStore }.
#   target          (optional) { name, creationPolicy, deletionPolicy, template }.
#   data            (optional) List of { secretKey, remoteRef }.
#   dataFrom        (optional) List of extract/find blocks.
#   labels/annotations/specExtra (optional)
externalSecrets: []
# Example:
#   externalSecrets:
#     - name: app-db
#       secretStoreRef:
#         name: aws-secretsmanager
#         kind: ClusterSecretStore
#       target:
#         name: app-db
#         creationPolicy: Owner
#       data:
#         - secretKey: password
#           remoteRef:
#             key: prod/app-db
#             property: password

# ---------------------------------------------------------------------------
# ClusterExternalSecrets (external-secrets.io/v1, cluster-scoped)
# ---------------------------------------------------------------------------
# Projects one ExternalSecret spec into many namespaces selected by label.
#
# Per-entry fields:
#   name               (required) ClusterExternalSecret name.
#   externalSecretName (optional) Name of the ExternalSecret created in each ns.
#   namespaceSelector  (optional) Label selector picking target namespaces.
#   namespaces         (optional) Explicit namespace name list.
#   namespaceSelectors (optional) List of label selectors.
#   refreshTime        (optional) How often to reconcile the namespace set.
#   externalSecretSpec (required) The ExternalSecret spec projected into each ns.
#   labels/annotations/specExtra (optional)
clusterExternalSecrets: []
# Example:
#   clusterExternalSecrets:
#     - name: registry-pull
#       namespaceSelector:
#         matchLabels:
#           eso.example.com/pull: "true"
#       externalSecretSpec:
#         secretStoreRef:
#           name: aws-secretsmanager
#           kind: ClusterSecretStore
#         target:
#           name: registry-pull
#         data:
#           - secretKey: .dockerconfigjson
#             remoteRef:
#               key: prod/registry-dockerconfig

# ---------------------------------------------------------------------------
# PushSecrets (external-secrets.io/v1alpha1, namespaced)
# ---------------------------------------------------------------------------
# Pushes a native Kubernetes Secret's values OUT to a provider backend (the
# reverse of ExternalSecret). Note: PushSecret is still v1alpha1.
#
# Per-entry fields:
#   name            (required) PushSecret name.
#   namespace       (optional) Target namespace (default: release namespace).
#   refreshInterval (optional) Push interval.
#   secretStoreRefs (optional) List of { name, kind } backends to push to.
#   selector        (optional) { secret: { name } } source Secret selector.
#   data            (optional) List of { match: { secretKey, remoteRef } } maps.
#   template        (optional) Template applied to the pushed payload.
#   updatePolicy    (optional) Replace | IfNotExists.
#   deletionPolicy  (optional) Delete | None.
#   labels/annotations/specExtra (optional)
pushSecrets: []
# Example:
#   pushSecrets:
#     - name: mirror-to-aws
#       secretStoreRefs:
#         - name: aws-secretsmanager
#           kind: ClusterSecretStore
#       selector:
#         secret:
#           name: app-generated
#       data:
#         - match:
#             secretKey: token
#             remoteRef:
#               remoteKey: prod/app-generated-token
#       updatePolicy: Replace
#       deletionPolicy: None
