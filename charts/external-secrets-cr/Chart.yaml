apiVersion: v2
name: external-secrets-cr
description: Custom resources for the External Secrets Operator — SecretStore, ClusterSecretStore, ExternalSecret, ClusterExternalSecret (external-secrets.io/v1) and PushSecret (external-secrets.io/v1alpha1). Deployed alongside the upstream external-secrets chart, which installs the operator and CRDs but does not template these config CRs.
