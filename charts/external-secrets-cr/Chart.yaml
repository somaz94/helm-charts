    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: External Secrets Operator
      url: https://github.com/external-secrets/external-secrets
    - name: External Secrets API reference
      url: https://external-secrets.io/latest/api/spec/
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release: data-driven External Secrets Operator config CRs (SecretStore, ClusterSecretStore, ExternalSecret, ClusterExternalSecret, PushSecret) rendered from list-valued inputs, filling the gap the upstream external-secrets chart leaves open."
