{{- $top := . -}}
{{- range $community := .Values.communities }}
apiVersion: metallb.io/v1beta1
kind: Community
metadata:
  name: {{ required "communities[].name is required" $community.name }}
  namespace: {{ $top.Release.Namespace }}
  labels:
    {{- include "metallb-cr.labels" $top | nindent 4 }}
    {{- with $community.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annot := include "metallb-cr.annotations" (dict "top" $top "extra" $community.annotations) }}
  {{- if $annot }}
  annotations:
    {{- $annot | nindent 4 }}
  {{- end }}
spec:
  communities:
    {{- toYaml (required "communities[].communities is required" $community.communities) | nindent 4 }}
---
{{- end }}
