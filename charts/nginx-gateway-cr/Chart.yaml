apiVersion: v2
name: nginx-gateway-cr
description: Custom resources (Gateway, NginxProxy, ReferenceGrant, ClientSettingsPolicy, ServiceMonitor / PodMonitor) for NGINX Gateway Fabric, deployed alongside the upstream NGF controller chart.
type: application
version: 0.4.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - nginx
  - nginx-gateway-fabric
  - ngf
  - gateway-api
  - kubernetes
  - networking
home: https://github.com/somaz94/helm-charts
sources:
  - https://github.com/somaz94/helm-charts
maintainers:
  - name: somaz94
    url: https://github.com/somaz94
annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/somaz94/helm-charts
    - name: NGINX Gateway Fabric
      url: https://github.com/nginx/nginx-gateway-fabric
  artifacthub.io/changes: |
    - kind: added
      description: "Add clientSettingsPolicies[] rendering ClientSettingsPolicy resources, attachable to a Gateway, HTTPRoute or GRPCRoute and covering spec.body and spec.keepAlive."
    - kind: added
      description: "Support keepAlive.minTimeout (NGF 2.6.0+, nginx 1.27.4+) to hold idle keep-alive connections open across an nginx reload."
  artifacthub.io/prerelease: "false"
